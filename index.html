<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PKBM Bunga Bangsa - LMS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <style>body{display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;background:#f8fafc;color:#475569;}</style>
</head>
<body>
  <p>Memuat...</p>
  <script>
    var SESSION_KEY = 'pkbm_lms_session';
    try {
      var data = localStorage.getItem(SESSION_KEY);
      if (data) {
        var session = JSON.parse(data);
        var now = Date.now();
        var last = new Date(session.lastActivity).getTime();
        if (now - last < 3600000) {
          session.lastActivity = new Date().toISOString();
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          if (session.role === 'GURU') { window.location.replace(new URL('pages/guru/dashboard.html', document.baseURI).href); }
          else if (session.role === 'SISWA') { window.location.replace(new URL('pages/siswa/dashboard.html', document.baseURI).href); }
          else if (session.role === 'ADMIN') { window.location.replace(new URL('pages/admin/dashboard.html', document.baseURI).href); }
          else { window.location.replace(new URL('login.html', document.baseURI).href); }
        } else { localStorage.removeItem(SESSION_KEY); window.location.replace(new URL('login.html', document.baseURI).href); }
      } else { window.location.replace(new URL('login.html', document.baseURI).href); }
    } catch(e) { window.location.replace(new URL('login.html', document.baseURI).href); }
  </script>
</body>
</html>
